  @font-face { font-family: SCRIPT; src: url(assets/fonts/VT323_400Regular.ttf); size-adjust: 125%; }
  @font-face { font-family: PIX; src: url(assets/fonts/PressStart2P-Regular.ttf); }
  @font-face { font-family: MONO; src: url(assets/fonts/Silkscreen_400Regular.ttf); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; height: auto; }
</style>
